<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Cerita Kecil Kita</title>
<style>
@font-face{font-family:"Lora";src:url(fonts/Lora-Variable.ttf);font-weight:400 700;font-style:normal}
@font-face{font-family:"Lora";src:url(fonts/Lora-Italic-Variable.ttf);font-weight:400 700;font-style:italic}
@font-face{font-family:"Poppins";src:url(fonts/Poppins-Bold.ttf);font-weight:700}
@font-face{font-family:"Inter";src:url(fonts/Inter-Black.otf);font-weight:900}
@font-face{font-family:"Inter";src:url(fonts/Inter-Medium.otf);font-weight:500}
@font-face{font-family:"Liberation Serif";src:url(fonts/LiberationSerif-Bold.ttf);font-weight:700}
@font-face{font-family:"Liberation Sans";src:url(fonts/LiberationSans-Bold.ttf);font-weight:700}
@font-face{font-family:"Liberation Mono";src:url(fonts/LiberationMono-Bold.ttf);font-weight:700}
@font-face{font-family:"DejaVu Serif";src:url(fonts/DejaVuSerif-Bold.ttf);font-weight:700}
@font-face{font-family:"TeX Gyre Bonum";src:url(fonts/texgyrebonum-bold.otf);font-weight:700}
@font-face{font-family:"TeX Gyre Schola";src:url(fonts/texgyreschola-bold.otf);font-weight:700}
@font-face{font-family:"TeX Gyre Termes";src:url(fonts/texgyretermes-bolditalic.otf);font-weight:700;font-style:italic}
@font-face{font-family:"TeX Gyre Termes";src:url(fonts/texgyretermes-bolditalic.otf);font-weight:700;font-style:normal}
@font-face{font-family:"TeX Gyre Chorus";src:url(fonts/texgyrechorus-mediumitalic.otf);font-weight:400;font-style:italic}
@font-face{font-family:"Caladea";src:url(fonts/Caladea-Bold.ttf);font-weight:700}
@font-face{font-family:"GFS Baskerville";src:url(fonts/GFSBaskerville.otf);font-weight:400}
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;cursor:pointer;user-select:none;-webkit-user-select:none}
canvas{display:block;width:min(100vw,calc(100vh*16/9));height:auto;aspect-ratio:16/9;background:#000}
#go{position:absolute;left:50%;top:82%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:rgba(0,0,0,.28);border:2px solid rgba(255,255,255,.7);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);transition:opacity .35s;opacity:.4;pointer-events:none}
#go:after{content:"";position:absolute;left:28px;top:21px;width:26px;height:30px;background:#fff;clip-path:polygon(0 0,100% 50%,0 100%)}
#go.on{opacity:.9}#go.hide{opacity:0}
#ui,#prog{position:fixed;left:0;right:0;bottom:0;display:none;gap:12px;align-items:center;padding:10px 14px;color:#fff;font:13px ui-monospace,monospace;background:rgba(0,0,0,.6)}
.debug #ui{display:flex}#seek{flex:1}
.bikin #prog{display:block;line-height:1.5}.bikin #go{display:none}
</style></head>
<body>
<div id="stage"><canvas id="c" width="1280" height="720"></canvas><div id="go"></div></div>
<div id="ui"><input type="range" id="seek" min="0" max="54.6" step="0.01" value="0"><span id="clock"></span></div>
<div id="prog"></div>
<audio id="aud" preload="auto" playsinline></audio>
<script src="config.js"></script>
<script src="src/engine.js"></script>
<script src="src/photos.js"></script>
<script src="src/desk.js"></script>
<script src="src/scenes.js"></script>
<script src="src/main.js"></script>
</body></html>
